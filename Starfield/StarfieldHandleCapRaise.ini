[General]
; 8M tier. 0 = 4,194,303 usable handles and 1,024 generations.
; Set to 1 for 8,388,607 usable handles and 512 generations. This doubles the
; replacement pool from 64 MiB to 128 MiB. With the default generation tracker,
; total plugin allocation increases from 72 MiB to 144 MiB.
Enable8M = 0

; Logs detailed above-cap plugin/reference samples every minute. 1 = on, 0 = off.
VerboseLogging = 0

; Maximum detailed references included in each verbose report. Range: 0-64.
SampleSize = 16

; Tracks per-slot generation reuse, reports the hottest slot, and warns on a wrap.
; Adds 8 MiB in the default 4M tier or 16 MiB in the 8M tier.
; 1 = on, 0 = off. Strongly recommended for the 8M tier.
GenerationWrapDetection = 1
